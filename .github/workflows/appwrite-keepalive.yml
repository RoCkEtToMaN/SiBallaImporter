# Tiene attivo il progetto Appwrite Cloud: sul piano Free i progetti senza "attività di sviluppo"
# per 7 giorni vengono messi in pausa (e cancellati dopo 90 giorni di pausa) e l'app smette di ricevere gli eventi.
# Letture e scritture di documenti NON bastano: l'importatore riscrive serate e workshop ogni notte
# e a novembre 2026 il progetto è stato messo in pausa lo stesso. Per questo, oltre alla lettura
# (che fa da allarme: se il progetto è in pausa il run fallisce e arriva la mail di GitHub),
# crea e cancella una collezione temporanea, cioè una modifica allo schema come dalla console.
# Se il progetto finisce di nuovo in pausa, neanche questo basta: l'unica cosa sicura è il piano Pro.
#
# Sta in questo repo (e non in SiBallaApp) perché GitHub disattiva i workflow pianificati
# dopo 60 giorni senza commit: qui se succede si ferma anche l'email del lunedì e ce ne si accorge.
# Secret: APPWRITE_API_KEY (lo stesso dell'importatore), con gli scope collections.read e collections.write.
name: Appwrite keep-alive

on:
  schedule:
    - cron: "17 6 * * *" # ogni giorno alle 06:17 UTC
  workflow_dispatch: # avvio manuale dalla tab Actions

env:
  APPWRITE_ENDPOINT: https://cloud.appwrite.io/v1
  APPWRITE_PROJECT: 6aa5651e00042e1452be
  APPWRITE_DATABASE: 6aa638b50000f24a7b92

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # serve solo per l'email in caso di errore (script e destinatari)
      - uses: actions/checkout@v4

      - name: Legge un documento da serate e workshop
        run: |
          exec > >(tee -a keepalive.log) 2>&1
          for collection in serate workshop; do
            status=$(curl -s -o response.json -w "%{http_code}" -G \
              "$APPWRITE_ENDPOINT/databases/$APPWRITE_DATABASE/collections/$collection/documents" \
              --data-urlencode 'queries[]={"method":"limit","values":[1]}' \
              --data-urlencode 'queries[]={"method":"select","values":["$id"]}' \
              -H "X-Appwrite-Project: $APPWRITE_PROJECT")

            echo "$collection -> HTTP $status"
            if [ "$status" != "200" ]; then
              # Fa fallire il run (e arriva l'email qui sotto) se il progetto è già in pausa
              grep -q project_paused response.json && echo "❌ Progetto Appwrite IN PAUSA: console Appwrite > progetto > Restore"
              echo "❌ Lettura di $collection fallita (HTTP $status): $(cat response.json)"
              exit 1
            fi
          done

      - name: Crea e cancella una collezione temporanea
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          exec > >(tee -a keepalive.log) 2>&1
          [ -n "$APPWRITE_API_KEY" ] || { echo "❌ Secret APPWRITE_API_KEY mancante"; exit 1; }
          auth=(-H "X-Appwrite-Project: $APPWRITE_PROJECT" -H "X-Appwrite-Key: $APPWRITE_API_KEY" -H "Content-Type: application/json")
          id="keepalive$(date +%s)"
          url="$APPWRITE_ENDPOINT/databases/$APPWRITE_DATABASE/collections"

          status=$(curl -s -o response.json -w "%{http_code}" -X POST "$url" "${auth[@]}" \
            -d "{\"collectionId\":\"$id\",\"name\":\"keep-alive (si cancella da sola)\"}")
          echo "crea $id -> HTTP $status"
          if [ "$status" != "201" ]; then
            # 401 = alla chiave manca lo scope collections.write (Appwrite console > Overview > API Keys)
            echo "❌ Collezione temporanea non creata (HTTP $status): $(cat response.json)"
            [ "$status" = "401" ] && echo "❌ Alla chiave APPWRITE_API_KEY mancano gli scope per creare collezioni (console Appwrite > API Keys)"
            exit 1
          fi

          status=$(curl -s -o response.json -w "%{http_code}" -X DELETE "$url/$id" "${auth[@]}")
          echo "cancella $id -> HTTP $status"
          if [ "$status" != "204" ]; then
            echo "❌ Collezione $id non cancellata (HTTP $status), toglila a mano dalla console: $(cat response.json)"
            exit 1
          fi

      # email (stessi destinatari dell'importatore) se un passo è fallito: dal 12 al 27/11/2026 il keep-alive
      # è fallito ogni giorno, le email di GitHub sono passate inosservate e il progetto è andato in pausa
      - name: Email se il keep-alive fallisce
        if: failure()
        env:
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_API_SECRET: ${{ secrets.MAILJET_API_SECRET }}
          ESITO: failure
          TITOLO: "⚠️ Appwrite keep-alive"
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/email_log.py keepalive.log SiBallaImportingData/appsettings.json
