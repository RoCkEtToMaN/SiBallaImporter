# Batch dell'importatore eventi.
#
# Secrets richiesti (Settings > Secrets and variables > Actions > Secrets):
#   MAILJET_API_KEY, MAILJET_API_SECRET  -> invio email
#   GOOGLE_SERVICE_ACCOUNT_JSON          -> contenuto del JSON del service account per Google Sheets
#   GEMINI_API_KEY                       -> controllo finale degli eventi con l'AI
#
# Variables opzionali (stessa pagina, tab Variables) per cambiare il comportamento
# dell'esecuzione pianificata senza toccare questo file:
#   ENABLE_SENDING, ENABLE_IMPORTING_ON_EXCEL, ENABLE_IMPORTING_ON_DB, UPDATE_SHEET_COORDINATES, GIORNI,
#   CERCA_IMMAGINI_SHEET, CERCA_INDIRIZZI, CERCA_INDIRIZZI_MAX
#
# Il programma legge la configurazione a strati (appsettings.json -> variabili d'ambiente -> riga di comando):
# qui le impostazioni e le chiavi arrivano come variabili d'ambiente Sezione__Chiave (es. Import__EnableSending).
# Valore usato: input del lancio manuale, altrimenti la Variable, altrimenti il default scritto qui sotto.
# I valori effettivi sono stampati all'avvio nel log dello step "Esegui importatore".

name: Importatore eventi

on:
  schedule:
    # Tutti i giorni, un tentativo ogni ora dalle 0:01 alle 6:01 italiane (l'email parte solo se ci sono
    # eventi nuovi, vedi Import__EmailSoloSeCambia). GitHub a volte salta o ritarda di ore i cron, quindi
    # più tentativi: il job "orario" fa girare solo il primo della giornata italiana, gli altri si fermano subito.
    # GitHub usa solo UTC: 22:01-05:01 UTC copre 0:01-6:01 sia con l'ora legale sia con la solare
    # (con la solare 22:01 UTC sono le 23:01 del giorno prima, e "orario" lo scarta).
    - cron: "1 22,23,0-5 * * *"
  workflow_dispatch:
    inputs:
      enable_sending:
        description: Invia l'email con gli eventi
        type: choice
        options: ["true", "false"]
        default: "true"
      enable_importing_on_excel:
        description: Aggiunge i nuovi eventi al Google Sheet
        type: choice
        options: ["true", "false"]
        default: "true"
      enable_importing_on_db:
        description: Carica gli eventi dello Sheet su Appwrite
        type: choice
        options: ["true", "false"]
        default: "true"
      update_sheet_coordinates:
        description: Riscrive sullo Sheet le coordinate trovate
        type: choice
        options: ["false", "true"]
        default: "false"
      giorni:
        description: Giorni coperti dall'email
        default: "7"
      solo_immagini:
        description: "Giro veloce: solo immagini (data/immagini, siti, loghi) e DB, senza ricerca online, email e Gemini"
        type: choice
        options: ["false", "true"]
        default: "false"

concurrency:
  group: importatore
  cancel-in-progress: false

jobs:
  # dei tentativi pianificati fa girare solo il primo del giorno italiano: il run riuscito lascia in cache
  # la chiave fatto-<data> (vedi "Segna giorno fatto"); il lancio manuale gira sempre
  orario:
    runs-on: ubuntu-latest
    outputs:
      esegui: ${{ steps.verifica.outputs.esegui }}
      giorno: ${{ steps.giorno.outputs.giorno }}
    steps:
      - id: giorno
        run: echo "giorno=$(TZ=Europe/Rome date +%F)" >> "$GITHUB_OUTPUT"

      - id: fatto
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: fatto
          key: fatto-${{ steps.giorno.outputs.giorno }}
          lookup-only: true

      - id: verifica
        env:
          CRON: ${{ github.event.schedule }}
          FATTO: ${{ steps.fatto.outputs.cache-hit }}
        run: |
          esegui=true
          if [ -n "$CRON" ]; then
            ora=$(TZ=Europe/Rome date +%H)
            # 22-23: tentativo delle 23:01 con l'ora solare (o ritardo enorme), è ancora il giorno prima
            if [ "$ora" -ge 22 ] || [ "$FATTO" = "true" ]; then esegui=false; fi
          fi
          echo "cron: ${CRON:-avvio manuale}, ora italiana: $(TZ=Europe/Rome date +%H:%M), già fatto oggi: ${FATTO:-no}, esegui: $esegui"
          echo "esegui=$esegui" >> "$GITHUB_OUTPUT"

  importa:
    needs: orario
    if: needs.orario.outputs.esegui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # contents: commit del dizionario dei luoghi; actions: avvio del workflow del sito a fine giro
    permissions:
      contents: write
      actions: write
    env:
      # il programma calcola il bollettino da DateTime.Today: il giorno deve essere quello italiano, non UTC
      TZ: Europe/Rome
      PROJECT: SiBallaImportingData/SiBallaImportingData.csproj
      OUT: ${{ github.workspace }}/out
      DATA_FILES: |
        out/DizionarioEventiInfo.json
        out/venues.json
        out/custom_locations.json
        out/ultima-email.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Service account Google
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: pwsh
        run: |
          if (-not $env:GOOGLE_SERVICE_ACCOUNT_JSON) { throw "Secret GOOGLE_SERVICE_ACCOUNT_JSON mancante" }
          # il JSON viene incorporato come EmbeddedResource in fase di build
          Set-Content -Path SiBallaImportingData/Resources/siballa-8c6d48649c13.json -Value $env:GOOGLE_SERVICE_ACCOUNT_JSON -Encoding utf8NoBOM

      - name: Build
        run: dotnet publish "$PROJECT" -c Release -r linux-x64 --self-contained false -o "$OUT"

      # i file GeoNames (~150 MB) vengono scaricati dall'app solo se mancano
      - name: Cache dati GeoNames
        uses: actions/cache@v4
        with:
          path: |
            out/allCountries.txt
            out/cities15000.txt
          key: geonames-v1

      # dizionario dei luoghi: viene aggiornato a ogni giro, quindi una cache nuova per ogni run
      - name: Ripristina dizionario luoghi
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DATA_FILES }}
          key: luoghi-${{ github.run_id }}
          restore-keys: luoghi-

      - name: Ripristina ultima email
        uses: actions/cache/restore@v4
        with:
          path: out/ultima-email.json
          key: email-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: email-

      - name: Esegui importatore
        id: importatore
        working-directory: out
        # bash = -eo pipefail: con il tee il passo fallisce comunque se fallisce il programma
        shell: bash
        env:
          # chiavi
          Email__MailjetApiKey: ${{ secrets.MAILJET_API_KEY }}
          Email__MailjetApiSecret: ${{ secrets.MAILJET_API_SECRET }}
          Gemini__ApiKey: ${{ secrets.GEMINI_API_KEY }}
          Appwrite__ApiKey: ${{ secrets.APPWRITE_API_KEY }}
          # impostazioni (sovrascrivono appsettings.json)
          # solo_immagini (menu SiBalla dello Sheet): niente ricerca online, email e indirizzi con Gemini
          Import__EnableSearching: ${{ inputs.solo_immagini == 'true' && 'false' || 'true' }}
          Import__EnableSending: ${{ inputs.solo_immagini == 'true' && 'false' || (inputs.enable_sending || vars.ENABLE_SENDING || 'true') }}
          # giro quotidiano: email solo se ci sono eventi che l'ultima email non aveva
          Import__EmailSoloSeCambia: "true"
          # di notte gli eventi nuovi vanno nello Sheet e lo Sheet va sul DB dell'app (le righe "da verificare" restano fuori);
          # dopo una correzione a mano nello Sheet basta un lancio manuale per riallineare il DB
          Import__EnableImportingOnExcel: ${{ inputs.enable_importing_on_excel || vars.ENABLE_IMPORTING_ON_EXCEL || 'true' }}
          Import__EnableImportingOnDB: ${{ inputs.enable_importing_on_db || vars.ENABLE_IMPORTING_ON_DB || 'true' }}
          Import__UpdateSheetCoordinates: ${{ inputs.update_sheet_coordinates || vars.UPDATE_SHEET_COORDINATES || 'false' }}
          Import__Giorni: ${{ inputs.giorni || vars.GIORNI || '7' }}
          # righe future con "Immagine" vuota: immagine di anteprima (og:image) del sito in "Riferimento" su Storage (max 100 per giro)
          Import__CercaImmaginiSheet: ${{ vars.CERCA_IMMAGINI_SHEET || 'true' }}
          # righe future dello Sheet senza indirizzo: Gemini cerca il locale e lo scrive come "gemini" (max 20 per giro)
          Import__CercaIndirizzi: ${{ inputs.solo_immagini == 'true' && 'false' || (vars.CERCA_INDIRIZZI || 'true') }}
          Import__CercaIndirizziMax: ${{ vars.CERCA_INDIRIZZI_MAX || '20' }}
          Import__ResetDb: "false"
          Import__ResetExcel: "false"
          Import__PulisciLezioni: "false"
          Import__PulisciLezioniScrivi: "false"
          Import__TestImmagini: "false"
          Import__TestSwing: "false"
          Import__TestIndirizzi: "false"
          # file di dati nella stessa cartella che le cache salvano e ripristinano
          Paths__DataDirectory: ${{ env.OUT }}
        # output anche in out/importatore.log: va nello ZIP del run e nell'email del log
        run: dotnet SiBallaImportingData.dll 2>&1 | tee importatore.log

      # i tentativi successivi di oggi trovano la chiave e non ripartono (i run sono in fila per la concurrency)
      # il giro veloce "solo immagini" non conta: quello completo della notte deve partire comunque
      - name: Segna giorno fatto
        if: inputs.solo_immagini != 'true'
        run: mkdir -p fatto && echo "run ${{ github.run_number }}" > fatto/giorno

      - name: Salva giorno fatto
        if: inputs.solo_immagini != 'true'
        uses: actions/cache/save@v4
        with:
          path: fatto
          key: fatto-${{ needs.orario.outputs.giorno }}

      - name: Salva ultima email
        if: always() && steps.importatore.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: out/ultima-email.json
          key: email-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Salva dizionario luoghi
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DATA_FILES }}
          key: luoghi-${{ github.run_id }}

      # il programma all'avvio prende data/DizionarioEventiInfo.json dal repo (la cache resta come riserva
      # finché il file non c'è); il commit lo fa questo step, così parte anche se il programma va in errore
      - name: Commit dizionario luoghi
        if: always()
        run: |
          [ -f out/DizionarioEventiInfo.json ] || exit 0
          mkdir -p data
          cp out/DizionarioEventiInfo.json data/
          git add data/DizionarioEventiInfo.json
          if git diff --cached --quiet; then echo "Dizionario invariato"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Dizionario luoghi: aggiornato dal run #${{ github.run_number }}"
          git pull --rebase
          git push

      # lo Sheet è cambiato (righe nuove, "sì" nella colonna Immagine): il sito pubblico si aggiorna subito
      # invece di aspettare il giro orario. Le modifiche via API non fanno partire lo script dello Sheet
      - name: Aggiorna sito pubblico
        if: always() && steps.importatore.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sito.yml --repo "${{ github.repository }}" --ref master || echo "::warning::Sito non avviato"

      - name: Allega file prodotti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: importatore-${{ github.run_number }}
          path: |
            out/*.json
            out/importatore.log
            !out/*.deps.json
            !out/*.runtimeconfig.json
            !out/siballa-*.json
          if-no-files-found: ignore
          retention-days: 30

      # log del giro per email (stessi destinatari dell'email degli eventi) con un riepilogo in cima;
      # parte anche se il programma è andato in errore e non fa mai fallire il run
      # nel giro veloce "solo immagini" solo se va in errore
      - name: Email con il log
        if: always() && steps.importatore.outcome != 'skipped' && (inputs.solo_immagini != 'true' || steps.importatore.outcome == 'failure')
        env:
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_API_SECRET: ${{ secrets.MAILJET_API_SECRET }}
          ESITO: ${{ steps.importatore.outcome }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/email_log.py out/importatore.log SiBallaImportingData/appsettings.json || true
