# Sito pubblico con gli eventi dello Google Sheet (colonne A-N, solo eventi futuri), ospitato su Cloudflare Pages.
#
# Secrets richiesti (Settings > Secrets and variables > Actions > Secrets):
#   GOOGLE_SERVICE_ACCOUNT_JSON  -> lo stesso dell'importatore (lettura dello Sheet)
#   CLOUDFLARE_API_TOKEN         -> token Cloudflare con permesso "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID        -> ID dell'account Cloudflare
# Variable opzionale (tab Variables):
#   CLOUDFLARE_PAGES_PROJECT     -> nome del progetto Pages (default "siballa" -> https://siballa.pages.dev);
#                                   se il progetto non esiste viene creato al primo giro
# Contatore visite + pagina nascosta /statistiche?chiave=... (sito/functions), da configurare su Cloudflare:
#   binding D1 "VISITE" (database siballa-visite) e secret "STATS_KEY" nel progetto Pages: vedi il documento.
# Clandestini (proposte degli utenti, approvazione su /clandestini-admin?chiave=STATS_KEY), stesso database VISITE;
#   secrets MAILJET_API_KEY e MAILJET_API_SECRET per l'email a ogni proposta (facoltativa EMAIL_DESTINATARI),
#   in Production e Preview. Le variabili nuove valgono dal deploy successivo.
#   Le anteprime (anteprima., clandestini. ...) usano l'ambiente Preview: binding VISITE e STATS_KEY vanno messi
#   anche lì (la STATS_KEY di Preview può essere diversa da quella di Production).
#   Per ripubblicare dopo aver cambiato variabili o binding su Cloudflare: Actions → Sito pubblico → Run workflow
#   scegliendo il branch (oppure un push che tocchi sito/ o questo file).

name: Sito pubblico

on:
  schedule:
    # ogni ora (al minuto 17: allo scoccare dell'ora GitHub ritarda di più i cron)
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    # master -> sito pubblico; anteprima -> versione di prova su anteprima.<progetto>.pages.dev
    # clandestini: prova della scheda Clandestini su clandestini.<progetto>.pages.dev (togliere prima del merge in master)
    branches: [master, anteprima, clandestini]
    paths:
      - "sito/**"
      - ".github/workflows/sito.yml"

concurrency:
  group: sito-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROGETTO: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'siballa' }}
      # "main" e' il ramo di produzione su Cloudflare; gli altri rami diventano anteprime <ramo>.<progetto>.pages.dev
      RAMO_CF: ${{ github.ref_name == 'master' && 'main' || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dipendenze
        run: pip install --quiet google-auth==2.35.0 requests==2.32.3 tzdata==2024.2

      - name: Esporta lo Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python sito/esporta_sheet.py _sito/eventi.json

      - name: Prepara il sito
        run: cp sito/*.html sito/*.css sito/*.js sito/logo-app.svg sito/og*.png _sito/

      # versione mostrata in fondo alle pagine (sito/piede.js): numero dell'ultima versione delle Novità
      # (prima "versione:" di sito/novita.js, es. 1.1.1.0), codice dell'ultimo commit, ramo, ora
      - name: Versione
        run: |
          VERSIONE=$(grep -m1 -oE 'versione: *"[^"]+"' sito/novita.js | sed -E 's/.*"([^"]+)"/\1/')
          printf '{"versione":"%s","commit":"%s","ramo":"%s","pubblicata":"%s"}\n' \
            "${VERSIONE:-$(git log -1 --format=%cd --date=format:%Y.%m.%d)}" "$(git rev-parse --short HEAD)" \
            "$GITHUB_REF_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _sito/versione.json
          cat _sito/versione.json

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Pubblica su Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Secret CLOUDFLARE_API_TOKEN mancante"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID mancante"; exit 1; }
          wrangler() { npx --yes wrangler@4.20.0 "$@"; }
          echo "Progetti Pages esistenti:"
          wrangler pages project list | tee progetti.txt
          # il primo giro crea il progetto
          if ! grep -qw -- "$PROGETTO" progetti.txt; then
            wrangler pages project create "$PROGETTO" --production-branch=main
          fi
          # da sito/ così wrangler include anche sito/functions (contatore visite e pagina statistiche)
          cd sito
          wrangler pages deploy ../_sito --project-name="$PROGETTO" --branch="$RAMO_CF" --commit-dirty=true

  email-novita:
    # Solo produzione: le anteprime non inviano email e non aggiornano lo storico.
    needs: pubblica
    if: github.ref_name == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Lo stesso gruppo dell'importatore impedisce invii contemporanei.
    concurrency:
      group: importatore
      cancel-in-progress: false
    env:
      TZ: Europe/Rome
      OUT: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Service account Google
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: pwsh
        run: |
          if (-not $env:GOOGLE_SERVICE_ACCOUNT_JSON) { throw "Secret GOOGLE_SERVICE_ACCOUNT_JSON mancante" }
          Set-Content -Path SiBallaImportingData/Resources/siballa-8c6d48649c13.json -Value $env:GOOGLE_SERVICE_ACCOUNT_JSON -Encoding utf8NoBOM
      - name: Build
        run: dotnet publish SiBallaImportingData/SiBallaImportingData.csproj -c Release -o "$OUT"
      - name: Cache dati GeoNames
        uses: actions/cache@v4
        with:
          path: |
            out/allCountries.txt
            out/cities15000.txt
          key: geonames-v1
      # Conserva gli stessi percorsi della vecchia cache per poter recuperare lo storico iniziale.
      - name: Ripristina storico precedente
        uses: actions/cache/restore@v4
        with:
          path: |
            out/DizionarioEventiInfo.json
            out/venues.json
            out/custom_locations.json
            out/ultima-email.json
          key: luoghi-${{ github.run_id }}
          restore-keys: luoghi-
      - name: Ripristina ultima email
        uses: actions/cache/restore@v4
        with:
          path: out/ultima-email.json
          key: email-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: email-
      - name: Invia solo se ci sono eventi nuovi
        working-directory: out
        env:
          Import__EmailSoloSheet: "true"
          Import__EnableSending: ${{ vars.ENABLE_SENDING || 'true' }}
          Import__EmailSoloSeCambia: "true"
          Import__Giorni: ${{ vars.GIORNI || '7' }}
          Import__NoPush: "true"
          Import__ResetExcel: "false"
          Email__PreviewFile: ""
          Email__MailjetApiKey: ${{ secrets.MAILJET_API_KEY }}
          Email__MailjetApiSecret: ${{ secrets.MAILJET_API_SECRET }}
          Paths__DataDirectory: ${{ env.OUT }}
        run: dotnet SiBallaImportingData.dll
      - name: Salva ultima email
        if: always()
        uses: actions/cache/save@v4
        with:
          path: out/ultima-email.json
          key: email-${{ github.run_id }}-${{ github.run_attempt }}
