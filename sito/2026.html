  ];

  document.getElementById("wrapped").innerHTML = SCHERMATE.map(function (s) { return s.html; }).join("");
  if (D.esempio) document.getElementById("esempio").hidden = false;

  var sezioni = [].slice.call(document.querySelectorAll(".slide"));
  var punti = document.getElementById("punti");
  sezioni.forEach(function (s, i) {
    s.id = "s" + (i + 1);

  function animaNumeri(s) {
    s.querySelectorAll("[data-conta]").forEach(function (el) {

      var t0 = performance.now(), dur = 1100;
      (function passo(t) {

  // ---- immagine per le storie Instagram (1080x1920), disegnata su canvas ----
  var W = 1080, H = 1920, FONT = '"Segoe UI", system-ui, -apple-system, Roboto, sans-serif';

    parole.forEach(function (p) {

    ctx.textBaseline = "alphabetic";

    }
    ctx.font = "800 " + (s.grande ? 80 : 110) + "px " + FONT; ctx.fillStyle = s.giallo ? GIALLO : "#fff";
    var alt = s.grande ? 88 : 118;
    aCapo(ctx, s.titolo, L).forEach(function (r) { y += alt; ctx.fillText(r, X, y); });

    if (s.testo) {
      ctx.font = "500 46px " + FONT; ctx.fillStyle = GRIGIO; y += 30;
      aCapo(ctx, s.testo, L).forEach(function (r) { y += 60; ctx.fillText(r, X, y); });
    }

    if (s.righe) {
      y += 70;
      s.righe.forEach(function (r) {
        rett(ctx, X, y, L, 120, 28); ctx.fillStyle = "#1B1B22"; ctx.fill();
        if (r[2] != null) { ctx.save(); rett(ctx, X, y, L, 120, 28); ctx.clip();
          ctx.fillStyle = "rgba(255,212,0,.18)"; ctx.fillRect(X, y, L * r[2], 120); ctx.restore(); }
        ctx.font = "700 50px " + FONT; ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.fillText(r[0], X + 40, y + 78);
        ctx.font = "800 50px " + FONT; ctx.fillStyle = GIALLO; ctx.textAlign = "right"; ctx.fillText(r[1], X + L - 40, y + 78);
        ctx.textAlign = "left"; y += 140;
      });
    }

    if (s.mesi) {
      var hMax = 520, base = y + 120 + hMax, gap = 18, bw = (L - gap * 11) / 12;
      D.mesi.forEach(function (v, i) {
        var h = Math.max(16, v / maxMese * hMax), bx = X + i * (bw + gap);
        rett(ctx, bx, base - h, bw, h, 14); ctx.fillStyle = i === iTop ? GIALLO : SCURO; ctx.fill();
        ctx.font = (i === iTop ? "800" : "600") + " 36px " + FONT; ctx.fillStyle = i === iTop ? GIALLO : GRIGIO;
        ctx.textAlign = "center"; ctx.fillText(MESI[i].charAt(0), bx + bw / 2, base + 56); ctx.textAlign = "left";
      });
      y = base + 56;
    }

    c._fine = y;
    ctx.font = "700 42px " + FONT; ctx.fillStyle = GRIGIO; ctx.textAlign = "center";
    ctx.fillText(INDIRIZZO, W / 2, H - 120); ctx.textAlign = "left";
    return c;
  }

  function salvaStoria(i, btn) {
    var testoBtn = btn.textContent; btn.disabled = true; btn.textContent = "Preparo l'immagine…";
    var fine = function () { btn.disabled = false; btn.textContent = testoBtn; };
    var pronto = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    pronto.then(function () {
      immagine(SCHERMATE[i].storia).toBlob(function (blob) {
        var nome = "siballa-" + D.anno + "-" + (i + 1) + ".png";
        var file = typeof File === "function" ? new File([blob], nome, { type: "image/png" }) : null;
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: "siBalla " + D.anno + " in numeri" }).catch(function () {}).then(fine);
        } else {
          var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nome;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000); fine();
        }
      }, "image/png");
    });
  }
})();
