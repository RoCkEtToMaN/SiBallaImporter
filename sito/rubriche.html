<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<script src="riservata.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rubriche · siBalla</title>
<meta name="description" content="La mossa della settimana, le giornate speciali e le altre rubriche della scena swing.">
<meta name="robots" content="noindex">
<link rel="icon" href="logo-app.svg" type="image/svg+xml">
<meta name="theme-color" content="#0E0E12">
<link rel="stylesheet" href="pagina.css">
<link rel="stylesheet" href="menu.css">
<style>
  .rubriche { display: grid; gap: 16px; max-width: 760px; }
  .contenuto { scroll-margin-top: 16px; }
  .contenuto.evidenziato { border-color: var(--accent); }
  .contenuto .rubrica { font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  .contenuto h3 { margin: 4px 0 2px; font-size: 21px; letter-spacing: -0.01em; }
  .contenuto .quando { font-size: 13px; color: var(--muted); }
  .contenuto .testo { margin-top: 10px; white-space: pre-line; color: rgba(255,255,255,.88); overflow-wrap: anywhere; }
  .contenuto .foto-c { display: block; width: 100%; max-height: 380px; object-fit: cover; border-radius: 12px; margin-top: 12px; background: var(--surface-2); }
  .video { position: relative; margin-top: 12px; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 12px; overflow: hidden; background: #000; }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .contenuto .autore { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .contenuto .azioni button { font: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 9px; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--text); }
  .contenuto .azioni button:hover { border-color: var(--accent); }
  .esito-cond { font-size: 13px; color: var(--muted); align-self: center; }
  /* sondaggio "Quali rubriche vorresti?" */
  .sondaggio { max-width: 760px; margin-top: 24px; }
  .sondaggio h3 { font-size: 19px; }
  .sondaggio .sub-s { margin: 4px 0 12px; font-size: 14px; color: var(--muted); }
  .opz { display: grid; gap: 8px; }
  .opz label { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; }
  .opz label:hover { border-color: rgba(255,212,0,.5); }
  .opz input { accent-color: var(--accent); width: 18px; height: 18px; margin: 2px 0 0; flex: none; }
  .opz input:checked + span b { color: var(--accent); }
  .opz small { display: block; color: var(--muted); font-size: 13px; }
  .opz .barra { position: relative; height: 6px; margin-top: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  .opz .barra i { position: absolute; inset: 0 auto 0 0; background: var(--accent); opacity: .8; }
  .opz .perc { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sondaggio .proposta { width: 100%; margin-top: 10px; font: inherit; font-size: 14px; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .sondaggio .proposta:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .sondaggio .invia { font: inherit; font-weight: 700; font-size: 14px; padding: 9px 16px; border-radius: 10px; border: 0; cursor: pointer;
    background: var(--accent); color: var(--on-accent); }
  .sondaggio .invia[disabled] { opacity: .6; cursor: default; }
  .esito-s { font-size: 13px; color: var(--muted); align-self: center; }
  .esito-s.errore { color: #FF6B6B; }
  .trappola { position: absolute; left: -9999px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-in">
      <a href="/" aria-label="Torna agli eventi"><img class="logo" src="logo-app.svg" alt="" width="84" height="84"></a>
      <div>
        <h1>Dove <span class="brand">siBalla</span> stasera?</h1>
        <p class="sub">Rubriche</p>
      </div>
    </div>
  </header>
  <main>
    <h2 class="titolo-sez">Rubriche</h2>
    <p class="intro">La mossa della settimana, le giornate speciali della scena swing e altre storie. I più recenti in alto.</p>
    <div id="contenuto"><p class="vuoto">Caricamento…</p></div>
    <form class="card sondaggio" id="sondaggio" hidden>
      <h3>Quali rubriche vorresti?</h3>
      <p class="sub-s">Scegline quante vuoi: apriamo prima quelle più votate. Puoi cambiare il voto quando vuoi.</p>
      <div class="opz" id="opz"></div>
      <input class="proposta" id="proposta" maxlength="200" placeholder="Altra idea? Scrivila qui (facoltativo)" aria-label="Proponi una rubrica">
      <input class="trappola" name="sito_web" id="sitoWeb" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="azioni"><button type="submit" class="invia" id="inviaS">Vota</button><span class="esito-s" id="esitoS" role="status"></span></div>
    </form>
  </main>
</div>
<script>
// Contenuti da contenuti.json (scheda "Contenuti" dello Sheet, oppure la bozza sito/elenchi/contenuti.csv).
// /rubriche?id=... porta a un contenuto preciso (è il link che si condivide).
(function () {
  var box = document.getElementById("contenuto");
  var dati = [], fonte = "", scelta = "";
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function data(g) {
    return g ? new Date(g + "T12:00:00Z").toLocaleDateString("it-IT", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" }) : "";
  }
  // YouTube: video dentro la pagina (youtube-nocookie); altri link (Instagram, TikTok...): pulsante "Guarda il video"
  function video(u) {
    u = String(u || "").trim();
    if (!/^https?:\/\//i.test(u)) return "";
    var m = /(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{11})/i.exec(u);
    if (m) return '<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/' + m[1] + '" title="Video" loading="lazy" ' +
      'allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>';
    return '<div class="azioni"><a class="pri" href="' + esc(u) + '" target="_blank" rel="noopener">▶ Guarda il video</a></div>';
  }
  function link(c) { return location.origin + "/rubriche?id=" + encodeURIComponent(c.id); }

  function disegna() {
    var conta = {};
    dati.forEach(function (c) { var r = c.rubrica || "Altro"; conta[r] = (conta[r] || 0) + 1; });
    var nomi = Object.keys(conta).sort(function (a, b) { return a.localeCompare(b, "it"); });
    var lista = dati.filter(function (c) { return !scelta || (c.rubrica || "Altro") === scelta; });
    box.innerHTML = (fonte === "bozza" ? '<p class="avviso">Contenuti di esempio: quelli veri si scrivono nella scheda "Contenuti" dello Google Sheet.</p>' : "") +
      (nomi.length > 1 ? '<div class="chips" role="group">' + [["", "Tutte", dati.length]].concat(nomi.map(function (n) { return [n, n, conta[n]]; })).map(function (c) {
        return '<button type="button" data-r="' + esc(c[0]) + '" aria-pressed="' + (c[0] === scelta) + '">' + esc(c[1]) + '<span class="n">' + c[2] + "</span></button>";
      }).join("") + "</div>" : "") +
      '<div class="rubriche">' + lista.map(function (c) {
        return '<article class="card contenuto" id="c-' + esc(c.id) + '">' +
          '<div class="rubrica">' + esc(c.rubrica || "") + "</div><h3>" + esc(c.titolo) + "</h3>" +
          (c.data ? '<div class="quando">' + esc(data(c.data)) + "</div>" : "") +
          (c.immagine && /^https?:\/\//i.test(c.immagine) ? '<img class="foto-c" src="' + esc(c.immagine) + '" alt="" loading="lazy" onerror="this.remove()">' : "") +
          video(c.video) +
          (c.testo ? '<div class="testo">' + esc(c.testo) + "</div>" : "") +
          (c.autore ? '<div class="autore">di ' + esc(c.autore) + "</div>" : "") +
          '<div class="azioni"><button type="button" class="condividi" data-id="' + esc(c.id) + '">↗ Condividi</button><span class="esito-cond" role="status"></span></div>' +
          "</article>";
      }).join("") + "</div>";
  }

  box.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-r]");
    if (b) { scelta = b.getAttribute("data-r"); disegna(); return; }
    var c = e.target.closest("button.condividi");
    if (!c) return;
    var cont = dati.filter(function (x) { return x.id === c.getAttribute("data-id"); })[0];
    if (!cont) return;
    var url = link(cont), esitoEl = c.parentNode.querySelector(".esito-cond");
    if (navigator.share) { navigator.share({ title: cont.titolo, text: (cont.rubrica ? cont.rubrica + ": " : "") + cont.titolo, url: url }).catch(function () {}); return; }
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { esitoEl.textContent = "Link copiato"; }, function () { esitoEl.textContent = url; });
    else esitoEl.textContent = url;
  });

  fetch("contenuti.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      dati = d.righe || [];
      fonte = d.fonte || "";
      if (!dati.length) { box.innerHTML = '<p class="box">Ancora nessun contenuto. Si scrivono nella scheda <b>Contenuti</b> dello Google Sheet.</p>'; return; }
      disegna();
      var id = "";
      try { id = new URLSearchParams(location.search).get("id") || ""; } catch (e) {}
      var el = id && document.getElementById("c-" + id);
      if (el) { el.classList.add("evidenziato"); el.scrollIntoView({ block: "start" }); }
    })
    .catch(function () { box.innerHTML = '<p class="vuoto">Impossibile caricare le rubriche, riprova più tardi.</p>'; });
})();

// Sondaggio "Quali rubriche vorresti?" (functions/api/sondaggio.js). Il browser ricorda un codice segreto
// (lo stesso della bacheca): serve solo a riconoscere il proprio voto per poterlo cambiare.
(function () {
  var form = document.getElementById("sondaggio"), opzEl = document.getElementById("opz");
  var esito = document.getElementById("esitoS"), btn = document.getElementById("inviaS"), prop = document.getElementById("proposta");
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  var token = "";
  try { token = localStorage.getItem("siballa-token") || ""; } catch (e) {}
  if (!/^[A-Za-z0-9-]{20,100}$/.test(token)) {
    token = crypto.randomUUID ? crypto.randomUUID() + "-" + crypto.randomUUID()
      : Array.from(crypto.getRandomValues(new Uint8Array(24)), function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
    try { localStorage.setItem("siballa-token", token); } catch (e) {}
  }
  var opzioni = [];

  // risultati visibili solo a chi ha già votato (così il voto non è influenzato)
  function disegna(d) {
    var mio = d.mio, scelte = mio ? mio.scelte : [];
    opzEl.innerHTML = opzioni.map(function (o) {
      var n = (d.conta && d.conta[o.k]) || 0, p = d.totale ? Math.round(n / d.totale * 100) : 0;
      return '<label><input type="checkbox" value="' + esc(o.k) + '"' + (scelte.indexOf(o.k) >= 0 ? " checked" : "") + ">" +
        '<span style="flex:1;min-width:0"><b>' + esc(o.t) + "</b><small>" + esc(o.d) + "</small>" +
        (mio ? '<span class="barra"><i style="width:' + p + '%"></i></span>' : "") + "</span>" +
        (mio ? '<span class="perc">' + p + "%</span>" : "") + "</label>";
    }).join("");
    if (mio && mio.proposta && !prop.value) prop.value = mio.proposta;
    btn.textContent = mio ? "Cambia voto" : "Vota";
    if (mio) esito.textContent = d.totale === 1 ? "Hai votato solo tu, per ora." : "Hanno votato " + d.totale + " persone.";
    esito.className = "esito-s";
  }

  fetch("/api/sondaggio?token=" + encodeURIComponent(token), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      if (!d.attivo || !d.opzioni) return;
      opzioni = d.opzioni;
      disegna(d);
      form.hidden = false;
    })
    .catch(function () {});

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var scelte = Array.prototype.map.call(opzEl.querySelectorAll("input:checked"), function (i) { return i.value; });
    if (!scelte.length && !prop.value.trim()) { esito.textContent = "Scegli almeno una rubrica o scrivi la tua idea."; esito.className = "esito-s errore"; return; }
    btn.disabled = true; esito.textContent = "Invio…"; esito.className = "esito-s";
    fetch("/api/sondaggio", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: token, scelte: scelte, proposta: prop.value, sito_web: document.getElementById("sitoWeb").value }) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.errore || "Errore " + r.status); return j; }); })
      .then(function (d) { disegna(d); esito.textContent = "Grazie! " + esito.textContent; })
      .catch(function (err) { esito.textContent = err.message || "Errore, riprova."; esito.className = "esito-s errore"; })
      .then(function () { btn.disabled = false; });
  });
})();
</script>
<script src="menu.js"></script>
<script src="novita.js"></script>
<script src="piede.js"></script>
<script src="howto.js"></script>
</body>
</html>
