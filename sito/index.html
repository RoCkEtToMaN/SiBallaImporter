<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dove siBalla stasera?</title>
<meta name="description" content="Serate e workshop swing in programma">
<link rel="icon" href="logo-app.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f7f6f3; --surface: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --border: #e3e1dc; --accent: #c2410c; --accent-soft: #fdeee6; --row-alt: #fbfaf8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141414; --surface: #1e1e1f; --text: #ededed; --muted: #9a9aa0;
      --border: #333336; --accent: #fb923c; --accent-soft: #3a2418; --row-alt: #232325; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; gap: 16px; }
  /* piastrella chiara: il disegno ha lo sfondo trasparente e i contorni neri (sul tema scuro sparirebbero) */
  header .logo { width: 64px; height: 64px; flex: none; border-radius: 14px; background: #fffaf2;
    padding: 6px; object-fit: contain; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  @media (max-width: 480px) { header .logo { width: 48px; height: 48px; border-radius: 11px; } }
  header h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  header h1 .brand { color: var(--accent); }
  header .sub { color: var(--text); font-size: 16px; margin-top: 6px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 20px 0 16px; }
  .tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 4px; }
  .tabs button { border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600;
    padding: 6px 14px; border-radius: 7px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
  .tabs .n { font-weight: 400; opacity: .75; margin-left: 4px; }
  input[type=search] { flex: 1 1 220px; min-width: 0; font: inherit; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .stili { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 16px; }
  .stili button { font: inherit; font-size: 13px; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .stili button .n { color: var(--muted); margin-left: 4px; font-size: 12px; }
  .stili button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .stili button[aria-pressed="true"] .n { color: rgba(255,255,255,.8); }
  .stili .tutti { color: var(--muted); border-style: dashed; }
  a { color: var(--accent); }
  .empty { color: var(--muted); padding: 32px 0; text-align: center; }

  /* tabella (schermi larghi) */
  .table-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--border); }
  th { position: sticky; top: 0; background: var(--surface); font-size: 12px; text-transform: uppercase;
    letter-spacing: .04em; color: var(--muted); white-space: nowrap; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:last-child td { border-bottom: 0; }
  td { min-width: 90px; max-width: 320px; overflow-wrap: anywhere; }
  td.nowrap { white-space: nowrap; }

  /* schede (telefono) */
  .cards { display: none; gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .card h2 { margin: 0 0 2px; font-size: 17px; }
  .card .when { color: var(--accent); font-weight: 600; font-size: 13px; margin-bottom: 8px; }
  .card dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 14px; }
  .card dt { color: var(--muted); }
  .card dd { margin: 0; overflow-wrap: anywhere; }
  @media (max-width: 760px) {
    .table-box { display: none; }
    .cards { display: grid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="logo-app.svg" alt="" width="64" height="64">
    <div>
      <h1>Dove <span class="brand">siBalla</span> stasera?</h1>
      <p class="sub">Serate e workshop swing</p>
      <p id="agg">Caricamento…</p>
    </div>
  </header>
  <div class="bar">
    <div class="tabs" role="tablist" id="tabs"></div>
    <input type="search" id="q" placeholder="Cerca per nome, città, organizzatore…" aria-label="Cerca">
  </div>
  <div class="stili" id="stili" role="group" aria-label="Filtra per stile"></div>
  <div class="table-box"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  <div class="cards" id="cards"></div>
  <div class="empty" id="empty" hidden>Nessun evento trovato.</div>
</div>
<script>
(function () {
  // indici delle colonne A..N con un ruolo speciale
  var COL = { inizio: 0, fine: 1, nome: 4, luogo: 5 };
  var dati = null, attivo = 0, scelti = {};
  // nomi degli stili come nello Sheet -> nome mostrato (stesse regole di ParseStili dell'importatore)
  var SINONIMI = {
    "lindy": "Lindy Hop", "lindy hop": "Lindy Hop", "lindyhop": "Lindy Hop",
    "balboa": "Balboa", "bal": "Balboa",
    "blues": "Blues", "blues dance": "Blues",
    "solo jazz": "Solo Jazz", "solojazz": "Solo Jazz", "solo": "Solo Jazz", "jazz": "Solo Jazz",
    "boogie": "Boogie Woogie", "boogie woogie": "Boogie Woogie", "boogiewoogie": "Boogie Woogie",
    "shag": "Shag", "collegiate shag": "Shag",
    "stlouisshag": "St. Louis Shag", "st. louis shag": "St. Louis Shag", "st louis shag": "St. Louis Shag",
    "slowbal": "Slow Balboa", "slow bal": "Slow Balboa", "slow balboa": "Slow Balboa",
    "charleston": "Charleston", "aerials": "Aerials", "afrodance": "Afrodance"
  };
  function stiliDi(testo) {
    var out = {};
    String(testo || "").split(/[,;\/|]/).forEach(function (s) {
      s = s.trim();
      if (s) out[SINONIMI[s.toLowerCase()] || s] = true;
    });
    return Object.keys(out);
  }
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // testo della cella con i link resi cliccabili
  function linkify(s) {
    var out = "", last = 0, re = /\b(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+)/gi, m;
    while ((m = re.exec(s))) {
      var url = m[0].replace(/[.,;)]+$/, "");
      out += esc(s.slice(last, m.index));
      out += '<a href="' + esc(/^www\./i.test(url) ? "https://" + url : url) + '" target="_blank" rel="noopener">' + esc(url) + "</a>";
      last = m.index + url.length;
    }
    return out + esc(s.slice(last));
  }
  function contenuto(ev, i) {
    var v = ev.celle[i] || "";
    if (i === COL.luogo && v && ev.mappa)
      return linkify(v) + ' · <a href="' + esc(ev.mappa) + '" target="_blank" rel="noopener">mappa</a>';
    return linkify(v);
  }
  function quando(ev) {
    var a = ev.celle[COL.inizio], b = ev.celle[COL.fine];
    return b && b !== a ? a + " → " + b : a;
  }

  function disegna() {
    var foglio = dati.fogli[attivo];
    if (!foglio) return;
    var q = $("q").value.trim().toLowerCase();
    // stili selezionati presenti in questo foglio: l'evento passa se ne ha almeno uno
    var conteggio = {};
    foglio.eventi.forEach(function (ev) { ev._stili.forEach(function (s) { conteggio[s] = (conteggio[s] || 0) + 1; }); });
    var attivi = Object.keys(scelti).filter(function (s) { return conteggio[s]; });
    var eventi = foglio.eventi.filter(function (ev) {
      if (attivi.length && !ev._stili.some(function (s) { return scelti[s]; })) return false;
      return !q || ev.celle.join(" ").toLowerCase().indexOf(q) >= 0;
    });

    var elenco = Object.keys(conteggio).sort(function (a, b) { return conteggio[b] - conteggio[a] || a.localeCompare(b); });
    $("stili").innerHTML = elenco.map(function (s) {
      return '<button type="button" data-stile="' + esc(s) + '" aria-pressed="' + !!scelti[s] + '">' +
        esc(s) + '<span class="n">' + conteggio[s] + "</span></button>";
    }).join("") + (attivi.length ? '<button type="button" class="tutti" data-stile="">Tutti gli stili</button>' : "");
    // colonne completamente vuote nel foglio: nascoste
    var usate = foglio.colonne.map(function (_, i) {
      return foglio.eventi.some(function (ev) { return ev.celle[i]; });
    });

    $("thead").innerHTML = "<tr>" + foglio.colonne.map(function (c, i) {
      return usate[i] ? "<th>" + esc(c) + "</th>" : "";
    }).join("") + "</tr>";
    $("tbody").innerHTML = eventi.map(function (ev) {
      return "<tr>" + ev.celle.map(function (_, i) {
        if (!usate[i]) return "";
        var cls = i === COL.inizio || i === COL.fine ? ' class="nowrap"' : "";
        return "<td" + cls + ">" + contenuto(ev, i) + "</td>";
      }).join("") + "</tr>";
    }).join("");

    $("cards").innerHTML = eventi.map(function (ev) {
      var righe = ev.celle.map(function (v, i) {
        if (!v || i === COL.inizio || i === COL.fine || i === COL.nome) return "";
        return "<dt>" + esc(foglio.colonne[i]) + "</dt><dd>" + contenuto(ev, i) + "</dd>";
      }).join("");
      return '<article class="card"><h2>' + esc(ev.celle[COL.nome] || "Evento") + "</h2>" +
        '<div class="when">' + esc(quando(ev)) + "</div><dl>" + righe + "</dl></article>";
    }).join("");

    $("empty").hidden = eventi.length > 0;
    document.querySelector(".table-box").hidden = eventi.length === 0;
  }

  function tabs() {
    $("tabs").innerHTML = dati.fogli.map(function (f, i) {
      return '<button role="tab" data-i="' + i + '" aria-selected="' + (i === attivo) + '">' +
        esc(f.nome) + '<span class="n">' + f.eventi.length + "</span></button>";
    }).join("");
  }

  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    attivo = +b.dataset.i;
    tabs(); disegna();
  });
  $("q").addEventListener("input", disegna);
  $("stili").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    var s = b.getAttribute("data-stile");
    if (!s) scelti = {};
    else if (scelti[s]) delete scelti[s];
    else scelti[s] = true;
    disegna();
  });

  fetch("eventi.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      dati = d;
      d.fogli.forEach(function (f) {
        var i = f.colonne.map(function (c) { return c.trim().toLowerCase(); }).indexOf("stile");
        f.eventi.forEach(function (ev) { ev._stili = i >= 0 ? stiliDi(ev.celle[i]) : []; });
      });
      var t = new Date(d.aggiornato);
      $("agg").textContent = "Aggiornato il " + t.toLocaleString("it-IT", { dateStyle: "long", timeStyle: "short" });
      tabs(); disegna();
    })
    .catch(function () { $("agg").textContent = "Impossibile caricare gli eventi, riprova più tardi."; });
})();
</script>
</body>
</html>
